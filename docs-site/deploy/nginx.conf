# Drop in /etc/nginx/sites-available/docs-aparcedo on services VM, symlink to sites-enabled.
# TLS terminated upstream by cloudflared tunnel — this listens plain HTTP on internal addr only.

server {
  listen 8080;
  server_name docs.aparcedo.org;

  root /var/www/docs-aparcedo/current;
  index index.html;

  # Pretty URLs: /signals/fft -> /signals/fft/index.html
  try_files $uri $uri/ $uri.html $uri/index.html =404;

  # Pagefind static assets — long cache, immutable hashes
  location /pagefind/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Hashed Astro assets
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML — short cache, must revalidate
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }

  # Sitemap + robots — short cache
  location ~* \.(xml|txt)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  # Strip trailing slash redirects done by Astro at build, no need to handle here.

  access_log /var/log/nginx/docs-aparcedo.access.log;
  error_log  /var/log/nginx/docs-aparcedo.error.log;
}
